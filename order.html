<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f0e6;
            text-align: center;
            padding: 50px;
        }

        .form-box {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        input {
            width: 90%;
            margin: 10px 0;
            padding: 10px;
        }

        button {
            background: #d4af37;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="form-box">
        <h2>Complete Your Order</h2>

        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="phone" placeholder="Phone Number">
        <input type="text" id="address" placeholder="Address">

        <button onclick="sendOrder()">Confirm Order</button>
    </div>

    <script>
        function sendOrder() {
            alert("تم استلام الطلب ✅");
        }
    </script>

    <script src="script.js"></script>

</body>

</html>
