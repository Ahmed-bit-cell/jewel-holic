<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.html">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0e6;
            text-align: center;
            padding: 50px;
        }

        .form-box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d4af37;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(45deg, #d4af37, #b8962e);
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            border-radius: 30px;
            font-size: 18px;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(45deg, #c4a030, #a88620);
        }

        h2 {
            color: #3e2c23;
        }
    </style>
</head>

<body>
    <div class="form-box">
        <h2>Complete Your Order</h2>

        <button onclick="window.location.href='https://wa.me/201021702269?text=Can I Make An Order'">Confirm Order
        </button>

    </div>
    <script src="script.js"></script>
</body>

</html>
